[project]
name = "bodyweight-api"
version = "0.1.0"
description = "FastAPI + SQLite backend for the body-weight tracker (M1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # SQLAlchemy from day one so the Postgres variant in backend-spec.md §5
    # stays a DATABASE_URL swap rather than a rewrite.
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Required by FastAPI for the multipart/form-data branch of POST /api/import.
    "python-multipart>=0.0.12",
]

# No pytest: tests are explicitly out of scope for M1 (backend-spec.md §7).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
